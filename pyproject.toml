[project]
name = "jobseekr"
version = "0.1.0"
description = "Self-hosted job application tracker: applications, posting links, and the exact CV and cover letter you sent"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adrian Profir" }]
keywords = ["job-search", "job-tracker", "self-hosted", "django"]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15",
    "django>=6.1,<6.2",
    "gunicorn>=26.2",
    "psycopg[binary]>=3.3",
    "urllib3>=2.8",
    "whitenoise>=6.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.14",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--strict-markers"
filterwarnings = [
    "error",
    # WhiteNoise warns when collectstatic has not run; tests do not need it.
    "ignore:No directory at:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM"]
