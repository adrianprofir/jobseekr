name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.
        Please do not include real personal data, secrets, or your server's addresses.
        Report security problems privately instead; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: For a link-capture problem, say which job board the link is from, but do not paste a private link.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag or commit you run.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output of `docker compose logs web`, with secrets and addresses removed.
      render: text
