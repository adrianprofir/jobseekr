<div class="field{% if field.field.widget.input_type == 'checkbox' %} checkbox{% endif %}{% if span %} span-2{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="muted" aria-hidden="true">*</span>{% endif %}</label>
  {{ field }}
  {% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}
  {% if field.help_text and not field.errors %}<small id="{{ field.auto_id }}_helptext">{{ field.help_text }}</small>{% endif %}
</div>
