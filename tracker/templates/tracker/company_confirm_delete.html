{% extends "base.html" %}
{% block title %}Delete {{ company.name }}{% endblock %}
{% block content %}
<article>
  <header><strong>Delete {{ company.name }}?</strong></header>
  <p>The company has no applications, so nothing else is affected.</p>
  <form method="post" class="actions">
    {% csrf_token %}
    <button type="submit" class="danger">Delete company</button>
    <a role="button" class="secondary outline" href="{{ company.get_absolute_url }}">Cancel</a>
  </form>
</article>
{% endblock %}
